<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Dunia Belajar Anak: Observasi Perkembangan Anak Usia Dini</title>
    <meta name="description" content="Aplikasi Edugame Interaktif Observasi Perkembangan Bermain Anak untuk pembelajaran mahasiswa dan manajemen evaluasi dosen." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function() {
        var cleanNetlify = function() {
          var els = document.querySelectorAll('iframe[src*="netlify"], iframe[id*="netlify"], #netlify-drawer, .netlify-badge, [data-netlify-deploy-id]');
          for (var i = 0; i < els.length; i++) {
            try { els[i].remove(); } catch(e) {}
          }
        };
        try {
          var obs = new MutationObserver(cleanNetlify);
          obs.observe(document.documentElement, { childList: true, subtree: true });
        } catch(e) {}
        window.addEventListener('DOMContentLoaded', cleanNetlify);
        window.addEventListener('load', cleanNetlify);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
